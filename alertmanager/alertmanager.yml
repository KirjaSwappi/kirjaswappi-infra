global:
  resolve_timeout: 5m

route:
  receiver: ops-default
  group_by: [alertname, severity]
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h
  routes:
    - matchers:
        - severity = critical
      receiver: ops-critical
      repeat_interval: 1h

receivers:
  - name: ops-default
    webhook_configs:
      - url: '$ALERTMANAGER_WEBHOOK_URL'
        send_resolved: true

  - name: ops-critical
    webhook_configs:
      - url: '$ALERTMANAGER_WEBHOOK_URL_CRITICAL'
        send_resolved: true
