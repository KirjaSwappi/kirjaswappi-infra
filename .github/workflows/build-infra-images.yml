name: Build Infra Images

on:
  push:
    branches:
      - main
    paths:
      - 'docker/prometheus/**'
      - 'docker/alertmanager/**'
      - 'docker/mongo-backup/**'
      - 'prometheus/**'
      - 'alertmanager/**'
      - 'scripts/mongo-backup.sh'
      - 'scripts/mongo-restore.sh'
      - '.github/workflows/build-infra-images.yml'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: prometheus
            image: ghcr.io/kirjaswappi/kirjaswappi-prometheus
            dockerfile: docker/prometheus/Dockerfile
          - service: alertmanager
            image: ghcr.io/kirjaswappi/kirjaswappi-alertmanager
            dockerfile: docker/alertmanager/Dockerfile
          - service: mongo-backup
            image: ghcr.io/kirjaswappi/kirjaswappi-mongo-backup
            dockerfile: docker/mongo-backup/Dockerfile

    steps:
      - name: Checkout infra
        uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ matrix.image }}
          tags: |
            type=sha,format=long,prefix=
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push ${{ matrix.service }}
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          pull: true
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}
